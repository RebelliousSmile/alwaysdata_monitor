name: garde-fous

# Sur tout le dépôt, sans filtre de chemin : un secret peut être committé
# n'importe où, et le lockfile de la console est hors du workflow vigie.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Somme du fichier de checksums de la release v8.30.1.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tout l'historique : un secret retiré reste dans git
      - name: installer gitleaks (somme vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks
      # Exceptions : .gitleaks.toml, par chemin, pour des faux positifs avérés.
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  tls-deps:
    name: rustls + ring seulement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh vigie/scripts/check-tls-deps.sh vigie/Cargo.lock vigie/app/src-tauri/Cargo.lock
