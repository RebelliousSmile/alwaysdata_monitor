name: garde-fous

# Sur tout le dépôt, sans filtre de chemin : un secret peut être committé
# n'importe où, et le lockfile de la console est hors du workflow vigie.
# Chaque semaine aussi : une faille se publie sans qu'aucun commit ne change
# (cron du lundi 05:17 UTC, minute décalée de l'heure pleine).
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Somme du fichier de checksums de la release v8.30.1.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tout l'historique : un secret retiré reste dans git
      - name: installer gitleaks (somme vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks
      # Exceptions : .gitleaks.toml, par chemin, pour des faux positifs avérés.
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  tls-deps:
    name: rustls + ring seulement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh vigie/scripts/check-tls-deps.sh vigie/Cargo.lock vigie/app/src-tauri/Cargo.lock

  deps:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_SCANNER_VERSION: "2.6.0"
      # Somme de osv-scanner_SHA256SUMS de la release v2.6.0 ; provenance
      # SLSA : vigie/docs/decisions.md, section « Dépendances (issue #22) ».
      # Binaire téléchargé à chaque run, jamais mis en cache.
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Exceptions datées (≤ 92 jours), motivées, IgnoredVulns seulement :
      # osv-scanner accepterait une entrée sans échéance ou PackageOverrides.
      - name: exceptions osv-scanner conformes
        run: python3 -I vigie/scripts/check-osv-exceptions.py $(git ls-files ':(glob)**/osv-scanner.toml')
      # Un composer.lock périmé ne reflète pas composer.json : le scanner ne
      # prouverait rien (sortie 2 sur un lock périmé).
      - name: composer.lock à jour
        run: composer validate --no-check-publish
      - name: installer osv-scanner (somme vérifiée)
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      # Lockfiles nommés : un lockfile absent sort en 127 au lieu d'être sauté.
      # Tout code non nul fait échouer le job (1 = faille, 127 = erreur,
      # 128 = aucun paquet). Exceptions : osv-scanner.toml du dossier du
      # lockfile, lu sans --config.
      - name: scanner les lockfiles
        run: >-
          ./osv-scanner scan source
          --lockfile=vigie/Cargo.lock
          --lockfile=vigie/app/src-tauri/Cargo.lock
          --lockfile=vigie/app/pnpm-lock.yaml
          --lockfile=composer.lock
