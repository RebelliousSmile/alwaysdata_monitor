name: vigie

# Veilleur uniquement : le module PrestaShop n'est pas concerné.
on:
  push:
    paths:
      - "vigie/**"
      - ".github/workflows/vigie.yml"
  pull_request:
    paths:
      - "vigie/**"
      - ".github/workflows/vigie.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows dès la phase 1 : la reprise locale (phase 5) utilise le
        # build Windows.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vigie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # même version que vigie/rust-toolchain.toml
          components: clippy, rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vigie/target
          key: vigie-${{ runner.os }}-${{ hashFiles('vigie/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
