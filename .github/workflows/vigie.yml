name: vigie

# Veilleur uniquement : ni le module PrestaShop ni la console (vigie/app).
on:
  push:
    paths:
      - "vigie/**"
      - "!vigie/app/**"
      - ".github/workflows/vigie.yml"
  pull_request:
    paths:
      - "vigie/**"
      - "!vigie/app/**"
      - ".github/workflows/vigie.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows dès la phase 1 : la reprise locale (phase 5) utilise le
        # build Windows.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vigie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # même version que vigie/rust-toolchain.toml
          components: clippy, rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vigie/target
          key: vigie-${{ runner.os }}-${{ hashFiles('vigie/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # Agent PHP sur la version minimale visée (8.1, celle du site A). Sous
      # Linux seulement : les tests de lien symbolique et de droits Unix sont
      # sautés sous Windows. Utilisateur non root, pour que les droits comptent.
      # Image php:8.1-cli linux/amd64 épinglée par digest (tag figé depuis le
      # 2026-01-02, PHP 8.1 n'étant plus maintenu).
      - name: agent PHP (8.1)
        if: runner.os == 'Linux'
        working-directory: .
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE":/w -w /w
          php:8.1-cli@sha256:12154452109ad780fedbcf68b820a2b7dc5880d66ee38b7d87129c2de225f836
          sh -c 'php -m | grep -qx sodium || { echo "sodium absent de php:8.1-cli"; exit 1; }; php vigie/agent/php/tests/run.php'
      # Bout en bout réel (tests/agent_e2e.rs) : serve Rust sur l'hôte, agent
      # PHP 8.1 dans la même image épinglée, réseau de l'hôte, même
      # utilisateur ; /tmp partagé pour les dossiers de l'agent. Le test échoue
      # au lieu d'être sauté quand VIGIE_E2E_PHP est posé.
      - name: bout en bout serve + agent PHP (8.1)
        if: runner.os == 'Linux'
        run: >-
          VIGIE_E2E_PHP="docker run --rm --network host --user $(id -u):$(id -g)
          -v $GITHUB_WORKSPACE:$GITHUB_WORKSPACE -v /tmp:/tmp
          php:8.1-cli@sha256:12154452109ad780fedbcf68b820a2b7dc5880d66ee38b7d87129c2de225f836 php"
          cargo test --locked --test agent_e2e -- --ignored
      # Comparateurs PHP et Composer (tests/vulns_php_diff.rs) contre
      # version_compare du même PHP 8.1 épinglé ; paires écrites sous /tmp,
      # partagé. Le test échoue au lieu d'être sauté quand VIGIE_PHP est posé.
      - name: différentiel version_compare (PHP 8.1)
        if: runner.os == 'Linux'
        run: >-
          VIGIE_PHP="docker run --rm --user $(id -u):$(id -g) -v /tmp:/tmp
          php:8.1-cli@sha256:12154452109ad780fedbcf68b820a2b7dc5880d66ee38b7d87129c2de225f836 php"
          cargo test --locked --test vulns_php_diff -- --ignored

  # Cible de déploiement du VPS : binaire statique musl, croisé par zigbuild.
  # Le valider ici évite de découvrir au déploiement une dépendance qui casse
  # sous musl (aws-lc, openssl).
  musl:
    name: musl (zigbuild)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vigie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # même version que vigie/rust-toolchain.toml
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
            vigie/target
          key: vigie-musl-${{ hashFiles('vigie/Cargo.lock') }}
      # Le cache peut déjà rendre le binaire : l'installer seulement s'il manque
      # ou n'est pas à la version épinglée.
      - name: cargo-zigbuild 0.23.4
        run: |
          if ! cargo zigbuild --version 2>/dev/null | grep -qx 'cargo-zigbuild 0.23.4'; then
            cargo install cargo-zigbuild --version 0.23.4 --locked --force
          fi
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
      # Les deux binaires du crate : le veilleur et vigie-inventory (#20).
      - name: binaires statiques
        run: |
          for bin in vigie vigie-inventory; do
            file "target/x86_64-unknown-linux-musl/release/$bin" | grep -q "statically linked"
          done
      # Empreinte et binaire publiés : le relevé de la cible les compare
      # (docs/audit-chemin-critique.md, « Cible réelle »).
      - name: empreintes SHA-256
        run: >-
          sha256sum target/x86_64-unknown-linux-musl/release/vigie
          target/x86_64-unknown-linux-musl/release/vigie-inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigie-musl
          path: vigie/target/x86_64-unknown-linux-musl/release/vigie
          retention-days: 14
          if-no-files-found: error

  # BOM de vigie-inventory contre le schéma officiel CycloneDX 1.7 (#20) :
  # chaque fixture de tests/fixtures/inventory-tool/, copiée sous son vrai nom,
  # et composer/ aussi avec --cms wordpress. cyclonedx-cli v0.33.1 (publiée le
  # 2026-07-23), somme de cyclonedx-linux-x64 relevée sur la release
  # (vigie/docs/decisions.md) ; téléchargé à chaque run, jamais mis en cache.
  inventory-schema:
    name: schéma CycloneDX 1.7 (vigie-inventory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYCLONEDX_CLI_VERSION: "0.33.1"
      CYCLONEDX_CLI_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    defaults:
      run:
        working-directory: vigie
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.93.0" # même version que vigie/rust-toolchain.toml
      - name: installer cyclonedx-cli (somme vérifiée)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cyclonedx" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-linux-x64"
          echo "${CYCLONEDX_CLI_SHA256}  $RUNNER_TEMP/cyclonedx" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cyclonedx"
      - run: cargo build --locked --release --bin vigie-inventory
      - name: valider le BOM de chaque fixture
        run: |
          set -eu
          for dir in tests/fixtures/inventory-tool/*/; do
            name=$(basename "$dir")
            # Deux lockfiles npm dans un dossier : refus attendu (code 2).
            [ "$name" = npm-and-yarn ] && continue
            project="$RUNNER_TEMP/projet-$name"
            mkdir -p "$project"
            for file in "$dir"*.fixture; do
              cp "$file" "$project/$(basename "$file" .fixture)"
            done
            for cms in "" wordpress; do
              [ -n "$cms" ] && [ "$name" != composer ] && continue
              out="$RUNNER_TEMP/sbom-$name${cms:+-$cms}.json"
              target/release/vigie-inventory sbom --project-dir "$project" --output "$out" ${cms:+--cms "$cms"}
              "$RUNNER_TEMP/cyclonedx" validate --input-file "$out" --input-version v1_7 --fail-on-errors
            done
          done
