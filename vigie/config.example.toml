# Modèle de ~/vigie/config.toml (sur le veilleur seulement).
#
# Le dépôt est public : la vraie liste des sites et le destinataire réel ne
# doivent jamais y être commités. Aucun secret ici : le mot de passe SMTP vit
# dans le fichier désigné par `password_file`, les clés publiques des agents
# sont en base (`vigie site add <id> --pubkey …`), les clés privées ne
# quittent jamais les sites.
#
# Le fichier est cherché dans --config, sinon dans $VIGIE_CONFIG, sinon dans
# ~/vigie/config.toml. Toute clé inconnue est refusée (code de retour 2).

# Base SQLite partagée par `vigie serve` et `vigie tick` (chemin absolu).
# Dans data/ : c'est le seul dossier que les unités systemd ouvrent en écriture,
# et SQLite y crée ses fichiers -wal et -shm.
database = "/home/vigie/vigie/data/vigie.db"

# API de la console (docs/api-console.md). Facultative : sans elle,
# `vigie device pair` est refusé. public_url est l'adresse publique du
# veilleur, telle que la console l'appelle ; elle entre dans le lien
# d'appairage. En https : http n'est admis que sur 127.0.0.1, ::1 ou localhost.
[api]
public_url = "https://veilleur.example.org"

# E-mails d'incident : un relais SMTP authentifié, port 587 en STARTTLS
# obligatoire. Un seul destinataire, jamais un client.
[alerts]
to = "alertes@example.org"
# Adresse de la boîte qui sert de relais ; c'est aussi l'identifiant SMTP,
# sauf si smtp_user est donné.
from = "vigie@example.org"
smtp_host = "smtp.example.org"
# smtp_port = 587
# smtp_user = "vigie@example.org"
# Mot de passe seul, sur une ligne. Fichier en 0600, au propriétaire du
# veilleur : sinon l'envoi est refusé avant toute connexion.
password_file = "/home/vigie/vigie/smtp-password"

# Analyse des logs, commune à tous les sites (docs/logs.md). protect_ips :
# IP sortantes du veilleur, jamais visées par une règle d'IP de
# `vigie site recommend` (docs/htaccess.md). Documentation : RFC 5737.
# [logs]
# protect_ips = ["192.0.2.1"]

# Bases de failles synchronisées chaque jour par vigie-vulns-sync.timer
# (`vigie vulns sync`, docs/failles.md) : liste fermée parmi osv-crates-io,
# osv-packagist et osv-npm. Sans cette section ou avec une liste vide, aucune
# synchronisation ni constat `vulns-sync`. Aucune URL n'est configurable.
# [vulns]
# sources = ["osv-crates-io", "osv-packagist", "osv-npm"]

# Identifiant : [a-z0-9-], 64 caractères au plus. URL en https, finie par /
# quand le site vit dans un sous-dossier (les chemins sondés y sont joints).
[[sites]]
id = "exemple"
url = "https://www.example.org/"
# generic (défaut), wordpress ou prestashop : active le contrôle des installeurs.
kind = "wordpress"
# php, node ou static : ce que le site exécute, qui filtre les commandes que
# le veilleur peut lui envoyer (docs/protocole-commandes.md). wordpress et
# prestashop impliquent php ; un site generic sans runtime n'en admet aucune.
# Déployer le binaire avant de poser cette clé (docs/hebergement.md).
# runtime = "php"
# Contrôle `content` : cette page doit répondre 200 et contenir ce texte.
# Sans keyword_url, c'est `url` ; sans keyword, seul le code 200 compte.
keyword_url = "https://www.example.org/kb/"
keyword = "/problemes/"
# Secondes entre deux passages des contrôles (60 au moins). Les contrôles TLS
# et des en-têtes passent au plus une fois par heure.
interval = 300
# Seulement si le site a un agent : secondes sans rapport valide avant
# l'incident `heartbeat` (180 au moins, 900 par défaut). Voir
# docs/protocole-agent.md.
# agent_silence = 900
# Logs HTTP poussés par l'agent (docs/logs.md, docs/agent-php.md). Sans
# source, /r/v1/logs refuse le site. hosts : hôtes du site en minuscules, sans
# port (obligatoire avec source) ; tz : fuseau IANA des lignes sans décalage.
# [sites.logs]
# source = "alwaysdata"
# hosts = ["www.example.org", "example.org"]
# tz = "Europe/Paris"
# tz est aussi le fuseau de %{TIME} des règles htaccess : sans lui,
# `vigie site recommend` ne propose que robots.txt. protect_ips : IP jamais
# visées par une règle d'IP (tâches planifiées, webhooks, bureau).
# protect_ips = ["198.51.100.10"]
# Inventaire des composants relevé par l'agent PHP 0.5.0 (issue #19,
# docs/agent-php.md, docs/failles.md). Sans cette section, /r/v1/inventory
# refuse le site avant de lire le corps. agent-php exige le runtime php
# (wordpress et prestashop l'impliquent).
# [sites.inventory]
# source = "agent-php"
