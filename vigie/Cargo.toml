[package]
# Vigie : nom figé le 2026-10-16 (vigie/docs/decisions.md).
name = "vigie"
version = "0.3.0"
edition = "2024"
# À garder identique à rust-toolchain.toml et à .github/workflows/vigie.yml.
rust-version = "1.93.0"
description = "Veilleur multi-sites : contrôles externes, rapports signés, alertes par e-mail"
publish = false

# Outil d'inventaire des projets sans agent PHP (issue #20, docs/inventaire.md) :
# même crate, même liste blanche et même signature que le veilleur ; version
# propre (`vigie::inventory::TOOL_VERSION`). Le binaire `vigie` reste
# src/main.rs.
[[bin]]
name = "vigie-inventory"
path = "src/bin/vigie-inventory.rs"

[[bin]]
name = "vigie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# matched-path : gabarit de route cité par le journal des appels de /api/v1.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
ed25519-dalek = "2"
env_logger = "0.11"
# Déjà tiré par url : encode l'adresse du veilleur dans le lien d'appairage.
form_urlencoded = "1"
getrandom = "0.4"
# Déjà tiré par axum : distingue un corps trop gros d'un corps interrompu.
http-body-util = "0.1"
# Fuseaux IANA des sources de logs sans décalage écrit ; base tz embarquée,
# indépendante de /usr/share/zoneinfo du VPS.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
log = "0.4"
# Rendu Unicode seulement, pour le terminal de `vigie device pair`.
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "macros", "signal", "time"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.17"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Décompresse la fixture de logs rotationnés (.gz).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
# Relit le QR code de `vigie device pair` sans dépendre d'une image.
rqrr = { version = "0.11", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
