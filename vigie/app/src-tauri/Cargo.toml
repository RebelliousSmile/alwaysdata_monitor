[package]
name = "vigie-console"
version = "0.1.0"
description = "Console Vigie : client de l'API du veilleur"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
# Le suffixe `_lib` évite, sous Windows, la collision entre la bibliothèque
# et l'exécutable du même nom.
name = "vigie_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
