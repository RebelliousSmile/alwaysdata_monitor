<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) {

    this.state = { src: { http: true, php: true, apache: false, sites: false }, chips: ['/commande'], open: { g1: true }, row: { 'g1-1': true } };

        { src: 'http', t: '21:03:05', code: 500, path: 'POST /commande?step=3', fields: [['Taille', '1,2 Ko'], ['Durée', '2,71 s'], ['Provenance', '/commande?step=3']] }
      ] },
      { id: 'g2', ip: '198.51.100.7', who: '198.51.100.7', tag: 'human', ua: 'Safari · iPhone', span: '21:05 → 21:06', rows: [
        { src: 'http', t: '21:05:31', code: 200, path: 'POST /commande?step=2', fields: [['Taille', '51 Ko'], ['Durée', '0,38 s'], ['Provenance', '/panier']] },

      { id: 'g3', ip: '2001:db8:33d0::/64', who: '2001:db8:33d0::/64', tag: 'me', ua: 'Chrome 152 · Windows · back-office', span: '21:20', rows: [
        { src: 'http', t: '21:20:02', code: 200, path: '/admin9615/index.php?controller=AdminOrders', fields: [['Taille', '61 Ko'], ['Durée', '0,62 s']] },
        { src: 'http', t: '', code: '', path: '+ 14 fichiers js/css en 1 s · 280 Ko', fields: [] }
      ] }
    ];
    var ipChip = st.chips.filter(function (c) { return c.indexOf('ip ') === 0; })[0];
    var groups = G.filter(function (g) { return !ipChip || ipChip === 'ip ' + g.ip; }).map(function (g) {
      var open = !!st.open[g.id];
      var rows = g.rows.filter(function (r) { return st.src[r.src]; });
      var nHttp = rows.filter(function (r) { return r.src === 'http' && r.code; }).length;
      var nPhp = rows.filter(function (r) { return r.src === 'php'; }).length;
      var focused = ipChip === 'ip ' + g.ip;
      return {
        who: g.who, tag: tags[g.tag][0], chip: chip(g.tag), ua: g.ua, span: g.span,
        count: nHttp + ' requêtes' + (nPhp ? ' · ' + nPhp + ' erreur PHP' : ''),
        open: open, aria: open ? 'true' : 'false',
        toggle: function () { var o = Object.assign({}, self.state.open); o[g.id] = !o[g.id]; self.setState({ open: o }); },

</script>
