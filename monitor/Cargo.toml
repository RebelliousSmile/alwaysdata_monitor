[package]
# Nom provisoire : l'outil n'a pas encore de nom.
name = "monitor"
version = "0.2.0"
edition = "2024"
# À garder identique à rust-toolchain.toml et à .github/workflows/monitor.yml.
rust-version = "1.93.0"
description = "Veilleur multi-sites : contrôles externes, rapports signés, alertes par e-mail"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "macros", "signal"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.17"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
