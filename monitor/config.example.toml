# Modèle de ~/monitor/config.toml (sur le veilleur seulement).
#
# Le dépôt est public : la vraie liste des sites et le destinataire réel ne
# doivent jamais y être commités. Aucun secret ici : le mot de passe SMTP vit
# dans le fichier désigné par `password_file`, les clés publiques des agents
# arrivent en phase 3, les clés privées ne quittent jamais les sites.
#
# Le fichier est cherché dans --config, sinon dans $MONITOR_CONFIG, sinon dans
# ~/monitor/config.toml. Toute clé inconnue est refusée (code de retour 2).

# Base SQLite partagée par `monitor serve` et `monitor tick` (chemin absolu).
# Dans data/ : c'est le seul dossier que les unités systemd ouvrent en écriture,
# et SQLite y crée ses fichiers -wal et -shm.
database = "/home/monitor/monitor/data/monitor.db"

# E-mails d'incident : un relais SMTP authentifié, port 587 en STARTTLS
# obligatoire. Un seul destinataire, jamais un client.
[alerts]
to = "alertes@example.org"
# Adresse de la boîte qui sert de relais ; c'est aussi l'identifiant SMTP,
# sauf si smtp_user est donné.
from = "monitor@example.org"
smtp_host = "smtp.example.org"
# smtp_port = 587
# smtp_user = "monitor@example.org"
# Mot de passe seul, sur une ligne. Fichier en 0600, au propriétaire du
# veilleur : sinon l'envoi est refusé avant toute connexion.
password_file = "/home/monitor/monitor/smtp-password"

# Identifiant : [a-z0-9-], 64 caractères au plus. URL en https, finie par /
# quand le site vit dans un sous-dossier (les chemins sondés y sont joints).
[[sites]]
id = "exemple"
url = "https://www.example.org/"
# generic (défaut), wordpress ou prestashop : active le contrôle des installeurs.
kind = "wordpress"
# Contrôle `content` : cette page doit répondre 200 et contenir ce texte.
# Sans keyword_url, c'est `url` ; sans keyword, seul le code 200 compte.
keyword_url = "https://www.example.org/kb/"
keyword = "/problemes/"
# Secondes entre deux passages des contrôles (60 au moins). Les contrôles TLS
# et des en-têtes passent au plus une fois par heure.
interval = 300
